name: 🐛 Bug Report / 问题反馈
description: Report a login, streaming, or UI issue in BotHub
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Agent Platform / 涉及平台
      options:
        - Grok Bot
        - ChatGPT Dot
        - Meta Muse
        - Hark
        - General UI / Settings / Proxy Pool
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10 / 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BotHub Version / 版本号
      placeholder: e.g. v0.5.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: Briefly describe what went wrong and how to reproduce it (please never paste real tokens or cookies!).
      placeholder: 1. Clicked '+' -> Grok Bot...
    validations:
      required: true
