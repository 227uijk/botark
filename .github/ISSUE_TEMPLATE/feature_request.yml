name: ✨ Feature or New Agent Request / 新功能或新平台建议
description: Suggest a workflow improvement or a new personal AI agent platform to integrate
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What would you like to see in BotHub? / 你希望增加什么能力或接入哪个平台？
      placeholder: Describe the agent platform or workflow feature and how it helps daily use...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context / 补充说明（可选）
      placeholder: Links, screenshots, or example workflows...
